<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="50%" stop-color="#b08a5a"/>
      <stop offset="100%" stop-color="#755535"/>
    </linearGradient>
    <linearGradient id="goldLight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#faeed6"/>
      <stop offset="100%" stop-color="#b08a5a"/>
    </linearGradient>
  </defs>
  <!-- Geometric luxury prism symbol -->
  <polygon points="50,10 88,32 88,76 50,98 12,76 12,32" stroke="url(#goldGradient)" stroke-width="3" fill="none" opacity="0.4"/>
  <polygon points="50,20 80,38 80,72 50,90 20,72 20,38" fill="url(#goldGradient)" fill-opacity="0.15" stroke="url(#goldGradient)" stroke-width="2"/>
  <polygon points="50,20 50,90 80,72 80,38" fill="url(#goldGradient)" fill-opacity="0.25"/>
  <circle cx="50" cy="50" r="12" fill="url(#goldLight)"/>
  <line x1="50" y1="20" x2="50" y2="90" stroke="url(#goldLight)" stroke-width="1.5"/>
  <line x1="20" y1="55" x2="80" y2="55" stroke="url(#goldLight)" stroke-width="1.5"/>
</svg>