  </g>
  <!-- Textos -->
  <text x="150" y="105" text-anchor="middle" font-family="'Cormorant Garamond', 'Georgia', serif" font-size="30" font-weight="600" letter-spacing="5" fill="#fcfbf9">LUMINA</text>
  <text x="150" y="124" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="500" letter-spacing="3.5" fill="#b08a5a">CONSULTING &amp; DESIGN</text>
