<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 140" width="300" height="140" fill="none">
  <defs>
    <linearGradient id="goldGradientF" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="50%" stop-color="#b08a5a"/>
      <stop offset="100%" stop-color="#755535"/>
    </linearGradient>
    <linearGradient id="goldLightF" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#faeed6"/>
      <stop offset="100%" stop-color="#b08a5a"/>
    </linearGradient>
  </defs>
  <!-- Símbolo Centralizado -->
  <g transform="translate(120, 10) scale(0.6)">
    <polygon points="50,10 88,32 88,76 50,98 12,76 12,32" stroke="url(#goldGradientF)" stroke-width="3" fill="none" opacity="0.4"/>
    <polygon points="50,20 80,38 80,72 50,90 20,72 20,38" fill="url(#goldGradientF)" fill-opacity="0.2" stroke="url(#goldGradientF)" stroke-width="2"/>
    <polygon points="50,20 50,90 80,72 80,38" fill="url(#goldGradientF)" fill-opacity="0.3"/>
